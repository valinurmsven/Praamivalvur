name: Update Expo packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: |
          npx expo install expo-notifications expo-device expo-constants expo-secure-store

      - name: Commit package lock
        run: |
          git config user.name "Praamivalvur Bot"
          git config user.email "actions@github.com"
          git add package.json package-lock.json
          git commit -m "Update Expo dependencies" || true
          git push
