name: Bootstrap Praamivalvur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Expo project
        run: |
          rm -rf /tmp/praamivalvur

          npx create-expo-app@latest /tmp/praamivalvur \
            --template blank \
            --yes

          rm -rf /tmp/praamivalvur/.git

          cp -R /tmp/praamivalvur/. .

      - name: Configure Android APK
        run: |
          cat > eas.json <<'EOF'
          {
            "build": {
              "preview": {
                "distribution": "internal",
                "android": {
                  "buildType": "apk"
                }
              }
            }
          }
          EOF

      - name: Commit project
        run: |
          git config user.name "Praamivalvur Bot"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Create Expo project" || true
          git push origin HEAD:main
